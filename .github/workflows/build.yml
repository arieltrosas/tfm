name: Build

on:
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            script_path: ./scripts/linux/build.sh
            artifact_path: build/linux/release/
            
          - os: macos-latest
            platform: macos
            script_path: ./scripts/macos/build.sh
            artifact_path: build/macos/release/
            
          - os: windows-latest
            platform: windows
            script_path: ./scripts/windows/build.sh
            artifact_path: build/windows/release/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python Dependencies
        working-directory: ./ai-agent
        run: uv sync

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: true

      - name: Run Build Script
        shell: bash
        run: |
          chmod +x ${{ matrix.script_path }}
          ${{ matrix.script_path }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-build
          path: ${{ matrix.artifact_path }}
